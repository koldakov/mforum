{% extends "base.html" %}

{% block title %}Register - mforum{% endblock %}

{% block content %}
    <h1>Create an account</h1>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
    </div>
    <p class="card-footer">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
