{% extends "base.html" %}

{% block title %}Settings - mforum{% endblock %}

{% block content %}
    <h1>Settings</h1>
    <div class="settings-layout">
        <nav class="settings-nav">
            <a
                href="{% url 'accounts:settings_general' %}"
                class="{% if active_tab == 'general' %}active{% endif %}"
            >General</a>
            <a
                href="{% url 'accounts:settings_security' %}"
                class="{% if active_tab == 'security' %}active{% endif %}"
            >Security</a>
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        </nav>
        <div class="settings-content">
            {% block settings_content %}{% endblock %}
        </div>
    </div>
{% endblock %}
