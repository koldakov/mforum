<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}mforum{% endblock %}</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e4e9;
            --text: #1a1c23;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-contrast: #ffffff;
            --danger: #dc2626;
            --danger-bg: #fdecec;
            --info-bg: #eef2ff;
            --info-text: #3730a3;
            --radius: 10px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14151a;
                --surface: #1c1e26;
                --border: #2c2f3a;
                --text: #e7e8ec;
                --text-muted: #9498a4;
                --primary: #818cf8;
                --primary-hover: #a5b4fc;
                --primary-contrast: #14151a;
                --danger: #f87171;
                --danger-bg: #3b1e1e;
                --info-bg: #1e2140;
                --info-text: #c7d2fe;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.5;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 4rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .brand:hover {
            text-decoration: none;
            color: var(--primary);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .avatar {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            background: var(--primary);
            color: var(--primary-contrast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: -0.01em;
            margin: 0 0 1.25rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.75rem;
            max-width: 380px;
        }

        .card-footer {
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        form p {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin: 0 0 1rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            font: inherit;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            width: 100%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
        }

        button,
        .btn {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            padding: 0.55rem 1.1rem;
            border: 1px solid transparent;
            background: var(--primary);
            color: var(--primary-contrast);
            transition: background 0.15s ease;
        }

        button:hover,
        .btn:hover {
            background: var(--primary-hover);
            text-decoration: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }

        .btn-ghost:hover {
            background: var(--info-bg);
            color: var(--text);
        }

        .errorlist {
            list-style: none;
            color: var(--danger);
            background: var(--danger-bg);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            margin: 0 0 1rem;
            font-size: 0.9rem;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem;
        }

        .messages li {
            padding: 0.6rem 0.9rem;
            background: var(--info-bg);
            color: var(--info-text);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .category-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.1rem 1.25rem;
        }

        .category-card h2 {
            margin: 0 0 0.25rem;
            font-size: 1.05rem;
        }

        .category-card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .empty-state {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <a class="brand" href="{% url 'forum:index' %}">mforum</a>
            <nav>
                {% if user.is_authenticated %}
                    <span class="user-chip">
                        <span class="avatar">{{ user.username|first }}</span>
                        {{ user.username }}
                    </span>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn-ghost">Log out</button>
                    </form>
                {% else %}
                    <a class="btn btn-ghost" href="{% url 'accounts:login' %}">Log in</a>
                    <a class="btn" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </nav>
        </header>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
